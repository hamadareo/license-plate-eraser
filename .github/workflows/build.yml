name: Build desktop app

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build app bundle
        run: pyinstaller "ナンバープレート消しツール.spec" --noconfirm

      - name: Ad-hoc sign
        run: codesign -s - --force "dist/ナンバープレート消しツール.app"

      - name: Zip app bundle
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "ナンバープレート消しツール.app" NumberPlateEraser-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/NumberPlateEraser-macos.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install CPU-only torch
        run: |
          pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build executable
        run: >
          pyinstaller --windowed --name NumberPlateEraser --icon assets\icon.ico
          --add-data "models/license-plate-finetune-v1s.pt;models"
          --collect-all ultralytics --collect-all simple_lama_inpainting
          --collect-all imageio_ffmpeg --collect-data certifi
          main.py

      - name: Zip build output
        run: Compress-Archive -Path dist\NumberPlateEraser -DestinationPath NumberPlateEraser-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: NumberPlateEraser-windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system libraries needed by PyQt6 at runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 zip

      - name: Install CPU-only torch
        run: |
          pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Install remaining dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-build.txt

      - name: Build executable
        run: >
          pyinstaller --windowed --name NumberPlateEraser --icon assets/icon_1024.png
          --add-data "models/license-plate-finetune-v1s.pt:models"
          --collect-all ultralytics --collect-all simple_lama_inpainting
          --collect-all imageio_ffmpeg --collect-data certifi
          main.py

      - name: Zip build output
        run: |
          cd dist
          zip -r ../NumberPlateEraser-linux.zip NumberPlateEraser

      - uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: NumberPlateEraser-linux.zip
